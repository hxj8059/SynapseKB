worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  client_max_body_size 210m;

  # Docker Compose service IPs can change when a backend container is
  # recreated. Resolve service names through Docker DNS at request time so a
  # long-lived web container never keeps a stale upstream address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=mcp_limit:10m rate=10r/s;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    set $api_backend api:8000;
    set $mcp_backend mcp-server:8001;

    location /api/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://$api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 310s;
    }

    location /mcp {
      limit_req zone=mcp_limit burst=20 nodelay;
      proxy_pass http://$mcp_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header Authorization $http_authorization;
      proxy_buffering off;
      proxy_read_timeout 310s;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
