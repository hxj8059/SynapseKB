[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "synapsekb"
version = "0.1.0"
description = "SynapseKB private intelligent knowledge base"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aioboto3>=13.4,<16",
  "aiofiles>=24.1,<26",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "beautifulsoup4>=4.12,<5",
  "cryptography>=44,<47",
  "dramatiq[redis,watch]>=1.17,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jieba>=0.42,<1",
  "langgraph>=0.2,<2",
  "mcp>=1.2,<2",
  "openai>=1.58,<3",
  "openpyxl>=3.1,<4",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-exporter-otlp>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.25,<2",
  "pyjwt>=2.10,<3",
  "python-dateutil>=2.9,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "python-pptx>=1.0,<2",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "structlog>=24.4,<26",
  "tenacity>=9,<10",
  "tiktoken>=0.8,<1",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
synapsekb-admin = "synapsekb.cli:app"
synapsekb-mcp = "apps.mcp_stdio_proxy.main:main"

[dependency-groups]
dev = [
  "coverage[toml]>=7.6,<8",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<7",
  "pytest-mock>=3.14,<4",
  "ruff>=0.9,<1",
  "testcontainers[postgres,redis]>=4.9,<5",
  "types-aiofiles>=24.1,<26",
  "types-openpyxl>=3.1,<4",
  "types-python-dateutil>=2.9,<3",
]

[tool.setuptools.packages.find]
where = ["packages", "."]
include = ["synapsekb*", "apps*"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires Docker services",
  "e2e: end-to-end test",
  "load: load test",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101", "S105", "B008", "RUF001", "ASYNC240", "SIM115"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["aioboto3", "botocore.*", "fitz", "jieba", "testcontainers.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["synapsekb"]

[tool.coverage.report]
show_missing = true
skip_covered = true
