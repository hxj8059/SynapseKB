name: synapsekb

x-backend: &backend
  image: synapsekb-backend:0.1.0
  build:
    context: .
    dockerfile: deploy/docker/backend.Dockerfile
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - local_storage:/data/storage

services:
  web:
    image: synapsekb-web:0.1.0
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
      mcp-server:
        condition: service_started

  api:
    <<: *backend
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  agent-runner:
    <<: *backend
    environment:
      DATABASE_POOL_MODE: "null"
    command:
      - dramatiq
      - apps.agent_runner.actors
      - --queues
      - agent
      - --processes
      - "1"
      - --threads
      - "8"

  document-worker:
    <<: *backend
    environment:
      DATABASE_POOL_MODE: "null"
    command:
      - dramatiq
      - apps.document_worker.actors
      - --queues
      - document
      - --processes
      - "1"
      - --threads
      - "4"

  ocr-worker:
    <<: *backend
    environment:
      DATABASE_POOL_MODE: "null"
    command:
      - dramatiq
      - apps.ocr_worker.actors
      - --queues
      - ocr
      - --processes
      - "1"
      - --threads
      - "2"

  wiki-worker:
    <<: *backend
    environment:
      DATABASE_POOL_MODE: "null"
    command:
      - dramatiq
      - apps.wiki_worker.actors
      - --queues
      - wiki
      - --processes
      - "1"
      - --threads
      - "1"

  wiki-scheduler:
    <<: *backend
    command:
      - python
      - -m
      - apps.wiki_worker.scheduler

  mcp-server:
    <<: *backend
    command:
      - uvicorn
      - apps.mcp_server.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"

  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synapsekb}
      POSTGRES_USER: ${POSTGRES_USER:-synapsekb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapsekb} -d ${POSTGRES_DB:-synapsekb}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  local_storage:
